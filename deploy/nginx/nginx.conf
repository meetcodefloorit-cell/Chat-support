worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  resolver 127.0.0.11 valid=10s ipv6=off;
  # Allow image/file uploads (project logos, attachments) without 413 from nginx.
  client_max_body_size 15m;

  upstream backend_upstream {
    zone backend_upstream 64k;
    # Re-resolve Docker DNS so upstream keeps working after container restarts.
    server backend:8000 resolve;
    keepalive 32;
  }

  upstream frontend_upstream {
    zone frontend_upstream 64k;
    # Re-resolve Docker DNS so upstream keeps working after container restarts.
    server frontend:3000 resolve;
    keepalive 32;
  }

  # Single internal entry for app/api/ws via a host-local bridge
  # (current VPS: host nginx 443 -> 127.0.0.1:4746 -> docker nginx:83).
  # Public TLS should terminate at host nginx/caddy and proxy to docker nginx.
  # All roles (admin / operator / member) use the same origin.
  server {
    listen 83;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$) {
      return 405;
    }

    location /api/ {
      proxy_pass http://backend_upstream/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://backend_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
      proxy_pass http://backend_upstream/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 10s;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
